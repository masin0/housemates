      <p class="note">Il voto è anonimo: si vede chi ha votato, mai cosa ha votato. I risultati compaiono quando hanno votato tutti oppure quando chi ha proposto la decisione la chiude.</p>
      <div id="polls"><div class="skeleton"></div></div>
    </section>`;
  loadPolls();
}
async function loadPolls(){
  if (!$('#polls')) return;
  const { data, error } = await sb.from('polls')
    .select('id,domanda,creato_da,chiuso,created_at,poll_options(id,testo),poll_voters(user_id)')
    .order('created_at', { ascending:false }).limit(20);
  if (!$('#polls')) return;
  if (error) { $('#polls').innerHTML = errorBox(error); return; }
  await loadProfiles();
  const total = profileList().length;
  const results = {};
  await Promise.all(data.filter(p => p.chiuso || p.poll_voters.length >= total).map(async p => {
    const { data: r } = await sb.rpc('poll_results', { p_poll: p.id });
    if (r && r.length) results[p.id] = r;
  }));
  if (!$('#polls')) return;
  cache.polls = Object.fromEntries(data.map(p => [p.id, p]));
  $('#polls').innerHTML = data.length ? data.map(p => pollCard(p, total, results[p.id])).join('')
    : emptyBox('Nessuna decisione. Tocca "Nuova" per proporne una.');
}
function pollCard(p, total, res){
  const voted = p.poll_voters.some(v => v.user_id === me.id);
  const n = p.poll_voters.length;
  const opts = [...p.poll_options].sort((a, b) => a.id - b.id);
  let body;
  if (res) {
    const count = id => Number((res.find(r => Number(r.option_id) === Number(id)) || {}).voti || 0);
    const tot = opts.reduce((s, o) => s + count(o.id), 0), max = Math.max(...opts.map(o => count(o.id)));
    body = opts.map(o => {
      const v = count(o.id), pct = tot ? Math.round(v / tot * 100) : 0;
      return `<div class="res ${v === max && v > 0 ? 'win' : ''}"><div class="res-top"><span>${esc(o.testo)}</span><span>${plural(v, 'voto', 'voti')}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
  } else if (p.chiuso) body = emptyBox('Votazione chiusa.');
  else if (voted) body = emptyBox(`Hai votato. I risultati compaiono quando votano tutti (${n}/${total}).`);
  else body = opts.map(o => `<button class="opt" data-a="vote:${p.id},${o.id}">${esc(o.testo)}</button>`).join('');
  const mine = p.creato_da === me.id;
  return `<div class="poll">
    <h3>${esc(p.domanda)}</h3>
    <div class="meta">
      <div class="voters">${p.poll_voters.map(v => avatar(v.user_id, 'sm')).join('')}</div>
      <span>${p.chiuso ? 'Chiusa' : `${n}/${total} hanno votato`}, proposta da ${mine ? 'te' : esc(nm(p.creato_da))}</span>
    </div>
    ${body}
    ${mine ? `<div class="poll-actions">${p.chiuso ? '' : `<button class="mini light" data-a="pclose:${p.id}">Chiudi e mostra risultati</button>`}<button class="mini danger" data-a="pdel:${p.id}">Elimina</button></div>` : ''}
  </div>`;
}
function vote(pid, oid){
  const p = cache.polls[pid]; const o = p && p.poll_options.find(x => String(x.id) === String(oid));
  customConfirm(`Votare "${o ? o.testo : ''}"? Il voto è anonimo e non si può cambiare.`, async () => {
    const { error } = await sb.rpc('cast_vote', { p_poll: Number(pid), p_option: Number(oid) });

   Giro delle pulizie, turni spostati d'autorità, checklist, coinquilini.

const SLOT_ART = { 'mer-bagno':'il bagno di mercoledì', 'we-bagno':'il bagno del weekend', 'we-cucina':'la cucina' };
let admGiroWeek = null;
function admWeeks(sel){
  const base = thisMonday();
  return [...Array(9)].map((_, k) => {
    const m = addDays(base, 7 * k);
    const lab = k === 0 ? 'Questa settimana' : k === 1 ? 'Prossima settimana' : 'Settimana';
    return `<option value="${m}" ${m === sel ? 'selected' : ''}>${lab}, ${fmtDays(m, addDays(m, 6))}</option>`;
  }).join('');
}
function renderGestione(){

  $('#view').innerHTML = hero('Gestione casa', { sub: 'Solo per gli amministratori. Ogni modifica vale subito per tutti.' }) + `

/* full = ridisegna anche i moduli; senza, aggiorna solo la lista dei coinquilini (così gli aggiornamenti
   in tempo reale non cancellano quello che stai scrivendo) */
async function loadGestione(full){
  if (!$('#adm-giro')) return;
  await loadProfiles();
  const err = await fetchChoreData();
  if (!$('#adm-giro')) return;
  if (!isAdmin()) return go('home');
  if (err) { $('#adm-giro').innerHTML = errorBox(err); return; }
  if (full === true) { drawAdmGiro(); drawAdmAssegna(); drawAdmCheck(); }
  drawAdmPeople();
}
function drawAdmGiro(){
  const el = $('#adm-giro'); if (!el) return;
  const mon = admGiroWeek || addDays(thisMonday(), 7);
  const r = rotation(mon), L = profileList().map(p => p.id);
  const posti = L.map((_, k) => ({ lbl: k < 3 ? SLOT_NOME[SLOT_ORDER[k]] : 'Riposo', who: k < 3 ? r[SLOT_ORDER[k]] : r.rest[k - 3] }));
  const used = new Set();
  posti.forEach(p => { if (!p.who || used.has(p.who)) p.who = ''; else used.add(p.who); });
  const left = L.filter(id => !used.has(id));
  posti.forEach(p => { if (!p.who) p.who = left.shift() || ''; });
  const opts = sel => '<option value="">Scegli…</option>' + profileList().map(p =>
    `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.nome)}${p.id === me.id ? ' (tu)' : ''}</option>`).join('');
  el.innerHTML = `
    <label class="field"><span class="lbl">Da quale settimana</span><select id="adm-giro-week">${admWeeks(mon)}</select></label>
    <span class="lbl">Chi fa cosa quella settimana</span>
    ${posti.map((p, k) => `<div class="slotrow"><span class="lbl">${p.lbl}</span><select data-slot="${k}" aria-label="${p.lbl}">${opts(p.who)}</select></div>`).join('')}
    <p class="note" style="margin-top:12px">Poi ogni lunedì tutti scalano di un posto: bagno di mercoledì, bagno del weekend, cucina, riposo.
    ${mon === thisMonday() ? ' Stai cambiando la settimana in corso: i turni di questi giorni passano subito alle persone scelte.' : ''}</p>
    <button class="btn" data-a="adm-giro">Salva il giro</button>`;
  $('#adm-giro-week').onchange = e => { admGiroWeek = e.target.value; drawAdmGiro(); };
}
function admSaveGiro(){

  if (ids.some(x => !x)) return toast('Scegli una persona per ogni posto');
  if (new Set(ids).size !== ids.length) return toast('Ogni persona deve comparire una volta sola');

}
function drawAdmAssegna(){

function admAssegna(){

function drawAdmPeople(){

/* ================= COSA TI SERVE (una frase diventa un'azione) =================
   Niente intelligenza artificiale: poche regole chiare. Scrivi e l'app propone cosa farne,
   tu scegli. Esempi: "latte, pane e uova" -> spesa; "12,50 pizza" -> spesa in Soldi;
   "entro in bagno 10" -> bagno occupato per 10 min; "prendiamo un tappeto?" -> decisione. */
const NUM = /(\d+(?:[.,]\d{1,2})?)\s*(?:€|euro)?/i;
const corto = s => s.length > 46 ? s.slice(0, 45).trim() + '…' : s;
function splitItems(t){
  const items = t.split(/,|;|\n|\s+e\s+/i).map(s => s.trim().replace(/^(compra(re)?|prendi|serve|servono|manca|mancano|finit[oaie])\s+/i, '')).filter(Boolean);
  return items.length && items.every(s => s.length <= 40 && s.split(/\s+/).length <= 5) ? items : [];
}
function askSuggest(raw){
  const t = raw.trim(), low = t.toLowerCase(), out = [], guest = isGuest();
  const add = (icon, title, sub, run, keep = false) => out.push({ icon, title, sub, run, keep });
  if (!t) {
    add(I.drop, 'Entro in bagno', 'Gli altri vedono che è occupato', () => bathAction('entra'));
    add(I.drop, 'Prenota il bagno', 'Scegli una fascia oraria', () => go('bagno'));
    if (guest) { add(I.star, 'Lascia un consiglio', 'Una recensione o un consiglio per la casa', () => { go('consigli'); newNoteForm(); }); return out; }
    add(I.cart, 'Aggiungi alla spesa', 'Scrivi qui sopra cosa serve, anche più cose separate da virgole',
        () => { const i = $('#ask-in'); i.placeholder = 'Cosa serve? Es. latte, pane, detersivo'; i.focus(); }, true);
    add(I.wallet, 'Registra una spesa', 'Chi ha pagato, quanto e tra chi dividerla', () => { go('soldi'); expenseForm(); });
    add(I.board, 'Scrivi in bacheca', 'Gli altri ricevono subito una notifica', () => { go('bacheca'); newAvvisoForm(); });
    add(I.guests, 'Aggiungi un ospite', 'Avvisa chi viene a stare da voi', () => { go('ospiti'); newGuestForm(); });
    add(I.vote, 'Proponi una decisione', 'Voto anonimo tra coinquilini', () => { go('decisioni'); newPollForm(); });
    return out;
  }
  const m = t.match(NUM), cents = m ? parseCents(m[1]) : 0;
  const resto = t.replace(NUM, ' ').replace(/\s{2,}/g, ' ').replace(/^[\s,.:;-]+|[\s,.:;-]+$/g, '');
  const bagno = /bagno|doccia/.test(low);
  if (bagno && /(entro|vado|occup|faccio la doccia)/.test(low)) {
    const min = m ? Math.min(120, Math.max(1, parseInt(m[1], 10))) : null;
    add(I.drop, min ? `Entro in bagno per ${min} min` : 'Entro in bagno', 'Gli altri vedono che è occupato', () => bathAction(min ? `entra:${min}` : 'entra'));
  }
  if (bagno && /(esco|uscit|finito|fatto|libero)/.test(low)) add(I.drop, 'Ho finito in bagno', 'Lo segno come libero', () => bathAction('esci'));
  if (bagno && /prenot/.test(low)) add(I.drop, 'Prenota il bagno', 'Scegli una fascia oraria', () => go('bagno'));
  if (guest) {
    add(I.star, 'Lascia un consiglio', `«${corto(t)}»`, () => { go('consigli'); newNoteForm(t); });
    if (!bagno) add(I.drop, 'Prenota il bagno', 'Scegli una fascia oraria', () => go('bagno'));
    return out;
  }
  if (/\?$/.test(t)) add(I.vote, 'Proponi come decisione', `«${corto(t)}», voto anonimo`, () => { go('decisioni'); newPollForm(t); });
  if (cents > 0 && resto && !bagno) add(I.wallet, `Registra una spesa di ${euro(cents)}`, `«${corto(resto)}», divisa tra tutti: puoi cambiarlo prima di salvare`,
    () => { go('soldi'); expenseForm(null, { descrizione: cap(resto), cents }); });
  if (/(ospit|viene a (trovarmi|dormire|stare)|dorme da)/.test(low)) add(I.guests, 'Aggiungi un ospite', 'Scegli le date prima di salvare', () => { go('ospiti'); newGuestForm(resto); });
  if (/turn/.test(low) && /(cambi|scambi|non riesco|non posso)/.test(low)) add(I.chores, 'Chiedi un cambio turno', 'Apri le faccende e scegli il turno', () => go('faccende'));
  const items = !cents && !bagno && !/\?$/.test(t) ? splitItems(t) : [];
  if (items.length) add(I.cart, items.length === 1 ? `Aggiungi «${corto(items[0])}» alla spesa` : `Aggiungi ${items.length} cose alla spesa`,
    items.length === 1 ? 'Finisce nella lista di tutti' : corto(items.join(', ')), () => addShopItems(items));
  add(I.board, 'Scrivi in bacheca', `«${corto(t)}»`, () => { go('bacheca'); newAvvisoForm(t); });
  return out;
}
let askItems = [], askSel = 0;
function drawAsk(){
  const v = $('#ask-in').value;
  askItems = askSuggest(v); askSel = 0;
  $('#ask-hint').textContent = v.trim() ? 'Cosa vuoi farne?' : isGuest() ? 'Puoi usare il bagno e lasciare un consiglio.'
    : 'Scrivi cosa serve in casa, una spesa con l’importo o un avviso. Oppure scegli qui sotto.';
  $('#ask-list').innerHTML = askItems.map((x, i) => `<button class="ask-it ${i === askSel ? 'on' : ''}" type="button" data-ask="${i}">
      <span class="hl-ic">${x.icon}</span>
      <span class="item-main"><span class="item-title" style="display:block">${esc(x.title)}</span><span class="item-sub" style="display:block">${esc(x.sub)}</span></span></button>`).join('');
}
function moveAsk(d){
  if (!askItems.length) return;
  askSel = (askSel + d + askItems.length) % askItems.length;
  document.querySelectorAll('.ask-it').forEach((b, i) => b.classList.toggle('on', i === askSel));
}
function runAsk(i){
  const x = askItems[i]; if (!x) return;
  if (!x.keep) closeAsk();
  x.run();
}
function openAsk(){
  if (!me || pending) return;
  closeModal();
  const i = $('#ask-in');
  i.value = ''; i.placeholder = 'Es. latte e pane, 12,50 pizza, entro in bagno';
  $('#ask').hidden = false; drawAsk(); i.focus();
}
function closeAsk(){ const a = $('#ask'); if (a && !a.hidden) a.hidden = true; }
async function addShopItems(items){
  const { error } = await sb.from('shopping').insert(items.map(nome => ({ nome: nome.slice(0, 60) })));
  if (error) return toast('Errore: ' + errMsg(error));
  toast(`Nella lista della spesa: ${items.join(', ')}`);
  refresh();
}
$('#ask-in').oninput = drawAsk;
$('#ask-in').onkeydown = e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveAsk(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveAsk(-1); }
};
$('#ask-form').onsubmit = e => { e.preventDefault(); runAsk(askSel); };
$('#ask-list').onclick = e => { const b = e.target.closest('[data-ask]'); if (b) runAsk(Number(b.dataset.ask)); };
$('#ask-close').onclick = closeAsk;
$('#ask').onclick = e => { if (e.target.id === 'ask') closeAsk(); };

/* ====== AZIONI (tutti i pulsanti con data-a) ====== */
const A = {
  go, ask: openAsk, bath: bathAction, day: selectDay, book,
  'adm-giro': admSaveGiro, 'adm-assegna': admAssegna, 'adm-check': admSaveCheck, 'adm-check-reset': admResetCheck, 'adm-p': admPerson,

  wk: d => { weekOff = Math.max(WEEK_MIN, Math.min(WEEK_MAX, weekOff + Number(d))); drawChores(); },
  step: toggleStep, swap: swapForm, swcancel: swapCancel,
  swyes: id => swapAnswer(id, true), swno: id => swapAnswer(id, false),
  ss: toggleShopSel, sd: deleteShop, sback: unbuy, 'clear-bought': clearBought, bought: boughtForm,
  'new-expense': () => expenseForm(), ee: id => expenseForm(id), settle: arg => settle(...arg.split(',')), ed: deleteExpense,
  rfyes: id => refundAction(id, 'conferma'), rfno: id => refundAction(id, 'rifiuta'), rfdel: id => refundAction(id, 'ritira'),
  'new-avviso': newAvvisoForm, avseen: seenAvviso, avd: deleteAvviso,
  'new-guest': newGuestForm, gd: deleteGuest,
  'new-note': newNoteForm, nd: deleteNote, nf: f => { noteFilter = f; renderConsigli(); },
  'new-poll': newPollForm, vote: arg => vote(...arg.split(',')), pclose: closePoll, pdel: deletePoll
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || !me) return;
  const s = el.dataset.a, i = s.indexOf(':');
  const name = i < 0 ? s : s.slice(0, i), arg = i < 0 ? '' : s.slice(i + 1);
  if (A[name]) A[name](arg);
});

/* ====== NOTIFICHE ======
   Avvisi del telefono mentre l'app è aperta (anche in secondo piano o installata in home).
   Per riceverli ad app chiusa serve un server push: vedi note. */
let swReg = null, pushOn = false;
async function initNotif(){
  if (!('serviceWorker' in navigator)) return;
  try { swReg = await navigator.serviceWorker.register('sw.js'); } catch (e) { return; }
  await registraPush();
}
/* Iscrive questo telefono alle notifiche push, così arrivano anche ad app chiusa */
const b64bytes = t => { const r = (t + '='.repeat((4 - t.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from([...atob(r)].map(c => c.charCodeAt(0))); };
async function registraPush(){
  if (!swReg || !me || !('PushManager' in window) || Notification.permission !== 'granted') return;
  try {
    const sub = await swReg.pushManager.getSubscription()
      || await swReg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64bytes(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const { error } = await sb.from('push_subs').upsert(
      { endpoint: j.endpoint, user_id: me.id, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict:'endpoint' });
    pushOn = !error;
  } catch (e) { pushOn = false; }
}
function notify(title, body, tag){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (!document.hidden && !['bagno','test'].includes(tag)) return;   // se stai già guardando l'app non ti disturbo
  if (pushOn && !['bagno','test'].includes(tag)) return;             // ci pensa il server, evito il doppione
  const opt = { body, tag, renotify: false, icon: 'icon-192.png', badge: 'icon-192.png', lang: 'it' };
  try { swReg ? swReg.showNotification(title, opt) : new Notification(title, opt); } catch (e) {}
}
function drawNotifBtn(){
  const bell = $('#notif-bell');
  if (bell) bell.hidden = !('Notification' in window) || Notification.permission !== 'default';
  const b = $('#notif-btn'); if (!b) return;
  const ok = 'Notification' in window;
  b.hidden = !ok || Notification.permission !== 'denied';   // per attivarle c'è la campanella in alto
  if (!b.hidden) b.className = 'foot-b hi', b.textContent = Notification.permission === 'denied'
    ? 'Notifiche bloccate: riattivale dalle impostazioni del browser' : 'Attiva le notifiche di spesa, faccende e bacheca';
}
async function askNotif(){
  if (!('Notification' in window)) return toast('Questo browser non supporta le notifiche');
  if (Notification.permission === 'denied') return toast('Le notifiche sono bloccate: riattivale dalle impostazioni del browser per questo sito');
  const r = await Notification.requestPermission();
  drawNotifBtn();
  if (r === 'granted') { await initNotif(); notify('Notifiche attive', 'Ti avviso per spesa, turni di pulizia, rimborsi e bacheca.', 'test'); toast('Notifiche attive'); }
  else toast('Notifiche non attivate');
}
/* Promemoria turno: una volta al giorno, quando tocca a te o sei in ritardo */
async function choreReminder(){
  if (isGuest() || pending) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const t = today();
  if (localStorage.getItem('avvisoTurno') === t) return;
  if (await fetchChoreData()) return;
  const s = weekShifts(thisMonday()).find(x => x.who === me.id && !x.done && (x.status === 'now' || x.status === 'late'));
  if (!s) return;
  localStorage.setItem('avvisoTurno', t);
  notify(s.status === 'late' ? 'Turno di pulizia in ritardo' : 'Oggi tocca a te',
         `${CHORES[s.task].nome}: ${s.tot - s.passi.length} passaggi da fare.`, 'turno');
}

/* ====== TEMPO REALE ====== */
/* Solo le tabelle di questa app (nello stesso database ci sono anche quelle di un altro progetto) */
const RT_TABLES = ['shopping','expenses','expense_splits','bathroom_bookings','bathroom_status','guests','polls','poll_options',
                   'poll_voters','chore_log','chore_swaps','house_notes','avvisi','avvisi_visti','rimborsi','profiles','giro_versioni','casa_config'];
let refreshT, profDirty = false;
function onChange(p){
  if (p.table === 'profiles') profDirty = true;
  clearTimeout(refreshT);
  refreshT = setTimeout(async () => {
    if (profDirty) { profDirty = false; await loadProfiles(); }
    refresh();
  }, 300);
}
function subscribe(){
  if (channel) return;
  channel = sb.channel('casa');
  for (const table of RT_TABLES) channel.on('postgres_changes', { event:'*', schema:'public', table }, onChange);
  channel
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'shopping' }, p => {
      const r = p.new; if (!r || r.aggiunto_da === me.id) return;
      notify('Lista della spesa', `${nm(r.aggiunto_da)} ha aggiunto ${r.nome}`, 'spesa');
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'chore_swaps' }, p => {
      const r = p.new; if (!r || r.destinatario !== me.id) return;
      notify('Cambio turno', `${nm(r.richiedente)} ti chiede di fare un suo turno di pulizia`, 'cambio');
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'chore_swaps' }, p => {
      const r = p.new; if (!r || r.richiedente !== me.id || r.stato === 'attesa') return;
      if (r.stato === 'accettato' || r.stato === 'rifiutato')
        notify('Cambio turno', `${nm(r.destinatario)} ha ${r.stato} il cambio`, 'cambio');
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'avvisi' }, p => {
      const r = p.new; if (!r || r.user_id === me.id) return;
      notify(`Bacheca: ${nm(r.user_id)}`, r.testo, 'bacheca');
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'rimborsi' }, p => {
      const r = p.new; if (!r || r.a !== me.id) return;
      notify('Rimborso da confermare', `${nm(r.da)} dice di averti dato ${euro(Math.round(Number(r.importo) * 100))}`, 'soldi');
    })
    .subscribe();
}
setInterval(() => { if (me && !pending && ['home', 'bagno', 'faccende', 'bacheca'].includes(tab) && $('#overlay').hidden) refresh(); }, 60000);
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !me) return;
  if (pending) return recheck(false);
  await loadProfiles(); refresh(); choreReminder();
});

/* ====== AVVIO ====== */
(async () => {
  const { data:{ session } } = await sb.auth.getSession();
  session ? enterApp(session.user) : showAuth();
})();
